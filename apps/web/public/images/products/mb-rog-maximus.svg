<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="50%" stop-color="#aa00ff"/>
      <stop offset="100%" stop-color="#00ccff"/>
    </linearGradient>
    <linearGradient id="heatsink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4a5a"/>
      <stop offset="100%" stop-color="#2a2a3a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="12"/>
  <!-- PCB base -->
  <rect x="60" y="40" width="280" height="220" rx="6" fill="url(#pcb)" stroke="#333" stroke-width="1"/>
  <!-- VRM heatsink top -->
  <rect x="70" y="50" width="100" height="35" rx="4" fill="url(#heatsink)"/>
  <rect x="75" y="55" width="90" height="3" rx="1" fill="url(#rgb)" opacity="0.8"/>
  <rect x="75" y="62" width="90" height="3" rx="1" fill="url(#rgb)" opacity="0.5"/>
  <rect x="75" y="69" width="90" height="3" rx="1" fill="url(#rgb)" opacity="0.3"/>
  <!-- CPU socket -->
  <rect x="185" y="65" width="80" height="80" rx="3" fill="#2a2a3a" stroke="#555" stroke-width="1.5"/>
  <rect x="195" y="75" width="60" height="60" rx="2" fill="#3a3a4a"/>
  <line x1="215" y1="75" x2="215" y2="135" stroke="#4a4a5a" stroke-width="0.5"/>
  <line x1="235" y1="75" x2="235" y2="135" stroke="#4a4a5a" stroke-width="0.5"/>
  <line x1="195" y1="95" x2="255" y2="95" stroke="#4a4a5a" stroke-width="0.5"/>
  <line x1="195" y1="115" x2="255" y2="115" stroke="#4a4a5a" stroke-width="0.5"/>
  <!-- RAM slots -->
  <rect x="285" y="55" width="8" height="90" rx="1" fill="#333"/>
  <rect x="297" y="55" width="8" height="90" rx="1" fill="#333"/>
  <rect x="309" y="55" width="8" height="90" rx="1" fill="#333"/>
  <rect x="321" y="55" width="8" height="90" rx="1" fill="#333"/>
  <!-- M.2 heatsink -->
  <rect x="80" y="170" width="150" height="25" rx="3" fill="url(#heatsink)"/>
  <rect x="85" y="175" width="140" height="2" rx="1" fill="url(#rgb)" opacity="0.6"/>
  <!-- PCIe slots -->
  <rect x="70" y="210" width="200" height="8" rx="2" fill="#2a2a3a" stroke="#444" stroke-width="0.5"/>
  <rect x="70" y="225" width="200" height="8" rx="2" fill="#2a2a3a" stroke="#444" stroke-width="0.5"/>
  <rect x="70" y="240" width="160" height="8" rx="2" fill="#2a2a3a" stroke="#444" stroke-width="0.5"/>
  <!-- I/O shield area -->
  <rect x="65" y="100" width="15" height="80" rx="2" fill="#3a3a4a"/>
  <!-- Brand accent -->
  <rect x="280" y="200" width="50" height="50" rx="4" fill="#1a1a2e" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="305" y="230" text-anchor="middle" fill="#e74c3c" font-size="14" font-weight="bold" font-family="sans-serif">ROG</text>
</svg>
