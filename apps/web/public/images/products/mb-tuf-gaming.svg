<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a0a"/>
      <stop offset="100%" stop-color="#2a2a15"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="12"/>
  <!-- TUF military style -->
  <rect x="60" y="40" width="280" height="220" rx="6" fill="#1a1a15" stroke="#8d6e2f" stroke-width="1.5"/>
  <!-- TUF badge -->
  <rect x="70" y="50" width="80" height="30" rx="3" fill="#2a2a15" stroke="#8d6e2f" stroke-width="1"/>
  <text x="110" y="70" text-anchor="middle" fill="#8d6e2f" font-size="12" font-weight="bold" font-family="sans-serif">TUF</text>
  <!-- Socket -->
  <rect x="190" y="65" width="75" height="75" rx="3" fill="#151510" stroke="#555" stroke-width="1.5"/>
  <!-- RAM -->
  <rect x="290" y="55" width="8" height="85" rx="1" fill="#2a2a15"/>
  <rect x="302" y="55" width="8" height="85" rx="1" fill="#2a2a15"/>
  <rect x="314" y="55" width="8" height="85" rx="1" fill="#2a2a15"/>
  <!-- M.2 -->
  <rect x="85" y="165" width="150" height="24" rx="3" fill="#2a2a15" stroke="#8d6e2f" stroke-width="0.8"/>
  <!-- PCIe -->
  <rect x="75" y="208" width="200" height="8" rx="2" fill="#2a2a15"/>
  <rect x="75" y="223" width="200" height="8" rx="2" fill="#2a2a15"/>
  <!-- Military marks -->
  <rect x="295" y="195" width="55" height="55" rx="4" fill="#1a1a15" stroke="#8d6e2f" stroke-width="1.5"/>
  <text x="322" y="225" text-anchor="middle" fill="#8d6e2f" font-size="10" font-weight="bold" font-family="sans-serif">MIL</text>
</svg>
