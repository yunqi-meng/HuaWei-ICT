<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0505"/>
      <stop offset="100%" stop-color="#2a1010"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="12"/>
  <!-- AMD Radeon style GPU -->
  <rect x="55" y="75" width="290" height="150" rx="10" fill="#1a0a0a" stroke="#ed1c24" stroke-width="1.5"/>
  <!-- Triple fan -->
  <circle cx="120" cy="150" r="44" fill="#0a0505" stroke="#333" stroke-width="2"/>
  <circle cx="120" cy="150" r="36" fill="none" stroke="#222" stroke-width="1"/>
  <circle cx="120" cy="150" r="8" fill="#1a0a0a"/>
  <circle cx="200" cy="150" r="44" fill="#0a0505" stroke="#333" stroke-width="2"/>
  <circle cx="200" cy="150" r="36" fill="none" stroke="#222" stroke-width="1"/>
  <circle cx="200" cy="150" r="8" fill="#1a0a0a"/>
  <circle cx="280" cy="150" r="44" fill="#0a0505" stroke="#333" stroke-width="2"/>
  <circle cx="280" cy="150" r="36" fill="none" stroke="#222" stroke-width="1"/>
  <circle cx="280" cy="150" r="8" fill="#1a0a0a"/>
  <!-- Red accent -->
  <rect x="65" y="215" width="270" height="3" rx="1" fill="#ed1c24" opacity="0.7"/>
  <rect x="65" y="85" width="270" height="3" rx="1" fill="#ed1c24" opacity="0.5"/>
  <!-- PCIe -->
  <rect x="90" y="230" width="180" height="10" rx="1" fill="#1a0a0a" stroke="#333" stroke-width="0.5"/>
  <text x="200" y="72" text-anchor="middle" fill="#ed1c24" font-size="11" font-weight="bold" font-family="sans-serif">RADEON</text>
</svg>
