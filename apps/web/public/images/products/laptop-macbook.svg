<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#151515"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="12"/>
  <!-- Laptop - MacBook style -->
  <!-- Screen -->
  <rect x="90" y="35" width="220" height="155" rx="8" fill="#111" stroke="#333" stroke-width="1.5"/>
  <rect x="100" y="45" width="200" height="135" rx="3" fill="#1a1a2e"/>
  <!-- Screen content hint -->
  <rect x="110" y="55" width="80" height="8" rx="2" fill="#333" opacity="0.5"/>
  <rect x="110" y="70" width="120" height="4" rx="1" fill="#333" opacity="0.3"/>
  <rect x="110" y="80" width="100" height="4" rx="1" fill="#333" opacity="0.3"/>
  <!-- Notch -->
  <rect x="185" y="45" width="30" height="8" rx="0" fill="#111"/>
  <!-- Base -->
  <path d="M70 195 L330 195 L340 215 L60 215 Z" fill="url(#lid)" stroke="#333" stroke-width="1"/>
  <!-- Keyboard hint -->
  <rect x="110" y="200" width="180" height="3" rx="1" fill="#222"/>
  <rect x="120" y="205" width="160" height="3" rx="1" fill="#222"/>
  <!-- Trackpad -->
  <rect x="170" y="208" width="60" height="4" rx="1" fill="#2a2a2a"/>
  <!-- Apple-style clean lines -->
  <rect x="70" y="218" width="260" height="2" rx="1" fill="#333"/>
</svg>
