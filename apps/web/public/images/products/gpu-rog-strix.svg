<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#1a1a3e"/>
    </linearGradient>
    <linearGradient id="shroud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a4a"/>
      <stop offset="100%" stop-color="#2a2a3a"/>
    </linearGradient>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="50%" stop-color="#0088ff"/>
      <stop offset="100%" stop-color="#8800ff"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="12"/>
  <!-- GPU PCB -->
  <rect x="40" y="100" width="320" height="100" rx="4" fill="#0d1117" stroke="#333" stroke-width="1"/>
  <!-- GPU shroud / cooler -->
  <rect x="50" y="70" width="300" height="140" rx="12" fill="url(#shroud)" stroke="#555" stroke-width="1"/>
  <!-- Triple fans -->
  <circle cx="120" cy="140" r="42" fill="#1a1a2e" stroke="#444" stroke-width="2"/>
  <circle cx="120" cy="140" r="35" fill="none" stroke="#555" stroke-width="1"/>
  <circle cx="120" cy="140" r="8" fill="#2a2a3a"/>
  <line x1="120" y1="105" x2="120" y2="175" stroke="#333" stroke-width="1"/>
  <line x1="85" y1="140" x2="155" y2="140" stroke="#333" stroke-width="1"/>
  <line x1="95" y1="115" x2="145" y2="165" stroke="#333" stroke-width="1"/>
  <line x1="145" y1="115" x2="95" y2="165" stroke="#333" stroke-width="1"/>

  <circle cx="200" cy="140" r="42" fill="#1a1a2e" stroke="#444" stroke-width="2"/>
  <circle cx="200" cy="140" r="35" fill="none" stroke="#555" stroke-width="1"/>
  <circle cx="200" cy="140" r="8" fill="#2a2a3a"/>
  <line x1="200" y1="105" x2="200" y2="175" stroke="#333" stroke-width="1"/>
  <line x1="165" y1="140" x2="235" y2="140" stroke="#333" stroke-width="1"/>
  <line x1="175" y1="115" x2="225" y2="165" stroke="#333" stroke-width="1"/>
  <line x1="225" y1="115" x2="175" y2="165" stroke="#333" stroke-width="1"/>

  <circle cx="280" cy="140" r="42" fill="#1a1a2e" stroke="#444" stroke-width="2"/>
  <circle cx="280" cy="140" r="35" fill="none" stroke="#555" stroke-width="1"/>
  <circle cx="280" cy="140" r="8" fill="#2a2a3a"/>
  <line x1="280" y1="105" x2="280" y2="175" stroke="#333" stroke-width="1"/>
  <line x1="245" y1="140" x2="315" y2="140" stroke="#333" stroke-width="1"/>
  <line x1="255" y1="115" x2="305" y2="165" stroke="#333" stroke-width="1"/>
  <line x1="305" y1="115" x2="255" y2="165" stroke="#333" stroke-width="1"/>

  <!-- RGB strip -->
  <rect x="55" y="200" width="290" height="4" rx="2" fill="url(#rgb)" opacity="0.8"/>
  <!-- PCIe connector -->
  <rect x="80" y="215" width="180" height="10" rx="1" fill="#2a2a3a" stroke="#444" stroke-width="0.5"/>
  <!-- ROG accent -->
  <rect x="310" y="215" width="45" height="25" rx="3" fill="#0a0a1a" stroke="#e74c3c" stroke-width="1.2"/>
  <text x="332" y="232" text-anchor="middle" fill="#e74c3c" font-size="9" font-weight="bold" font-family="sans-serif">ROG</text>
</svg>
