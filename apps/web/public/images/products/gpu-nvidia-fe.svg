<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="fe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="12"/>
  <!-- Founders Edition clean design -->
  <rect x="60" y="80" width="280" height="140" rx="8" fill="url(#fe)" stroke="#555" stroke-width="1"/>
  <!-- Dual fan FE design -->
  <circle cx="150" cy="150" r="50" fill="#111" stroke="#444" stroke-width="2"/>
  <circle cx="150" cy="150" r="42" fill="none" stroke="#333" stroke-width="1.5"/>
  <circle cx="150" cy="150" r="10" fill="#222"/>
  <!-- Fan blades -->
  <path d="M150 110 Q165 130 150 150 Q135 130 150 110" fill="#2a2a2a" stroke="#333" stroke-width="0.5"/>
  <path d="M190 150 Q170 165 150 150 Q170 135 190 150" fill="#2a2a2a" stroke="#333" stroke-width="0.5"/>
  <path d="M150 190 Q135 170 150 150 Q165 170 150 190" fill="#2a2a2a" stroke="#333" stroke-width="0.5"/>
  <path d="M110 150 Q130 135 150 150 Q130 165 110 150" fill="#2a2a2a" stroke="#333" stroke-width="0.5"/>

  <circle cx="250" cy="150" r="50" fill="#111" stroke="#444" stroke-width="2"/>
  <circle cx="250" cy="150" r="42" fill="none" stroke="#333" stroke-width="1.5"/>
  <circle cx="250" cy="150" r="10" fill="#222"/>
  <path d="M250 110 Q265 130 250 150 Q235 130 250 110" fill="#2a2a2a" stroke="#333" stroke-width="0.5"/>
  <path d="M290 150 Q270 165 250 150 Q270 135 290 150" fill="#2a2a2a" stroke="#333" stroke-width="0.5"/>
  <path d="M250 190 Q235 170 250 150 Q265 170 250 190" fill="#2a2a2a" stroke="#333" stroke-width="0.5"/>
  <path d="M210 150 Q230 135 250 150 Q230 165 210 150" fill="#2a2a2a" stroke="#333" stroke-width="0.5"/>

  <!-- Side accent line -->
  <rect x="70" y="210" width="260" height="3" rx="1" fill="#76b900" opacity="0.6"/>
  <text x="200" y="95" text-anchor="middle" fill="#888" font-size="10" font-family="sans-serif">NVIDIA GEFORCE RTX</text>
</svg>
