<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#162040"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="12"/>
  <rect x="60" y="40" width="280" height="220" rx="6" fill="#0d1520" stroke="#f57c00" stroke-width="1"/>
  <!-- AORUS eagle motif -->
  <polygon points="200,60 220,90 180,90" fill="#f57c00" opacity="0.3"/>
  <!-- VRM -->
  <rect x="75" y="55" width="105" height="38" rx="4" fill="#1a2535" stroke="#f57c00" stroke-width="0.8"/>
  <!-- Socket -->
  <rect x="195" y="68" width="78" height="78" rx="3" fill="#0a1525" stroke="#445" stroke-width="1.5"/>
  <rect x="205" y="78" width="58" height="58" rx="2" fill="#152030"/>
  <!-- RAM -->
  <rect x="295" y="58" width="8" height="88" rx="1" fill="#1a2535"/>
  <rect x="307" y="58" width="8" height="88" rx="1" fill="#1a2535"/>
  <rect x="319" y="58" width="8" height="88" rx="1" fill="#1a2535"/>
  <rect x="331" y="58" width="8" height="88" rx="1" fill="#1a2535"/>
  <!-- M.2 -->
  <rect x="85" y="168" width="155" height="26" rx="3" fill="#1a2535" stroke="#f57c00" stroke-width="0.8"/>
  <!-- PCIe -->
  <rect x="75" y="212" width="210" height="8" rx="2" fill="#1a2535"/>
  <rect x="75" y="228" width="210" height="8" rx="2" fill="#1a2535"/>
  <text x="320" y="225" text-anchor="middle" fill="#f57c00" font-size="12" font-weight="bold" font-family="sans-serif">AORUS</text>
</svg>
