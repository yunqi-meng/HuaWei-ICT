<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#2d1b4e"/>
    </linearGradient>
    <linearGradient id="carbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#2d2d2d"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="12"/>
  <rect x="60" y="40" width="280" height="220" rx="6" fill="url(#carbon)" stroke="#444" stroke-width="1"/>
  <!-- Carbon fiber pattern hint -->
  <rect x="70" y="50" width="260" height="200" rx="4" fill="none" stroke="#333" stroke-width="0.5" stroke-dasharray="4 2"/>
  <!-- VRM heatsink with carbon look -->
  <rect x="75" y="55" width="110" height="40" rx="4" fill="#2a2a2a" stroke="#e74c3c" stroke-width="1"/>
  <rect x="80" y="60" width="100" height="4" rx="1" fill="#e74c3c" opacity="0.7"/>
  <rect x="80" y="68" width="100" height="4" rx="1" fill="#e74c3c" opacity="0.4"/>
  <!-- CPU socket -->
  <rect x="200" y="70" width="75" height="75" rx="3" fill="#1a1a1a" stroke="#666" stroke-width="1.5"/>
  <rect x="210" y="80" width="55" height="55" rx="2" fill="#2a2a2a"/>
  <!-- RAM slots -->
  <rect x="295" y="60" width="8" height="85" rx="1" fill="#333"/>
  <rect x="307" y="60" width="8" height="85" rx="1" fill="#333"/>
  <rect x="319" y="60" width="8" height="85" rx="1" fill="#333"/>
  <!-- M.2 Shield Frozr -->
  <rect x="85" y="165" width="160" height="28" rx="3" fill="#2a2a2a" stroke="#e74c3c" stroke-width="1"/>
  <text x="165" y="183" text-anchor="middle" fill="#e74c3c" font-size="8" font-family="sans-serif">M.2 SHIELD</text>
  <!-- PCIe -->
  <rect x="75" y="210" width="200" height="8" rx="2" fill="#2a2a2a"/>
  <rect x="75" y="225" width="200" height="8" rx="2" fill="#2a2a2a"/>
  <!-- MSI dragon accent -->
  <circle cx="320" cy="215" r="25" fill="#1a0a2e" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="320" y="220" text-anchor="middle" fill="#e74c3c" font-size="11" font-weight="bold" font-family="sans-serif">MSI</text>
</svg>
